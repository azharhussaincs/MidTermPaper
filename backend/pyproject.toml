[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The formatter enforces line length on code; long prose strings (questions, prompts) are fine.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real LLM (needs RUN_LIVE_LLM_TESTS=1 and a configured provider)"]
