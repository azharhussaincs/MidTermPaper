<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title>MindBridge LangGraph StateGraph</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a857d"/>
    </marker>
    <style>
      .ttl{font-size:16px;font-weight:700;fill:#1b2422}
      .sub{font-size:11.5px;fill:#66625b}
      .nm{font-family:Menlo,Consolas,monospace;font-size:12.5px;font-weight:700;fill:#1b2422}
      .bd{font-size:11px;fill:#66625b}
      .lb{font-size:11px;fill:#66625b}
      .box{fill:#fff;stroke:#8a857d;stroke-width:1.25}
      .acc{fill:#e8f5f3;stroke:#0f766e;stroke-width:2}
      .pill{fill:#f1efeb;stroke:#8a857d;stroke-width:1.25}
      .ln{fill:none;stroke:#8a857d;stroke-width:1.25}
    </style>
  </defs>
  <rect width="760" height="660" fill="#fff"/>
  <text x="24" y="28" class="ttl">Every finished or urgent check-in stops at a clinician review</text>
  <text x="24" y="46" class="sub">AssessmentGraphState · SqliteSaver checkpoint after every step · router functions in app/graph/nodes.py</text>

  <g class="ln">
    <path d="M380 116V136" marker-end="url(#a)"/>
    <path d="M472 164H590" marker-end="url(#a)"/>
    <path d="M380 192V244" marker-end="url(#a)"/>
    <path d="M472 262H536" marker-end="url(#a)"/>
    <path d="M536 282H472" marker-end="url(#a)"/>
    <path d="M288 272H190" marker-end="url(#a)"/>
    <path d="M380 300V364" marker-end="url(#a)"/>
    <path d="M380 332H140V364" marker-end="url(#a)"/>
    <path d="M380 332H628V364" marker-end="url(#a)"/>
    <path d="M628 300V332"/>
    <path d="M140 420V462" marker-end="url(#a)"/>
    <path d="M380 420V468" marker-end="url(#a)"/>
    <path d="M288 496H264V392H288" marker-end="url(#a)"/>
    <path d="M472 496H600V572" marker-end="url(#a)"/>
    <path d="M656 420V572" marker-end="url(#a)"/>
    <path d="M536 600H410" marker-end="url(#a)"/>
  </g>

  <circle cx="380" cy="96" r="20" class="pill"/>
  <text x="380" y="100" text-anchor="middle" font-size="10.5" fill="#1b2422">START</text>

  <rect x="288" y="136" width="184" height="56" rx="8" class="box"/>
  <text x="380" y="160" text-anchor="middle" class="nm">load_context</text>
  <text x="380" y="176" text-anchor="middle" class="bd">crisis scan, sync audit</text>
  <rect x="590" y="150" width="60" height="28" rx="14" class="pill"/>
  <text x="620" y="168" text-anchor="middle" font-size="11.5" fill="#1b2422">END</text>
  <text x="531" y="154" text-anchor="middle" class="lb">already reviewed</text>

  <rect x="288" y="244" width="184" height="56" rx="8" class="box"/>
  <text x="380" y="268" text-anchor="middle" class="nm">interviewer</text>
  <text x="380" y="284" text-anchor="middle" class="bd">LLM with 4 tools bound</text>
  <rect x="536" y="244" width="184" height="56" rx="8" class="box"/>
  <text x="628" y="268" text-anchor="middle" class="nm">tools</text>
  <text x="628" y="284" text-anchor="middle" class="bd">run tool, refresh audit</text>
  <text x="504" y="254" text-anchor="middle" class="lb">calls</text>
  <text x="504" y="298" text-anchor="middle" class="lb">results</text>
  <rect x="130" y="258" width="60" height="28" rx="14" class="pill"/>
  <text x="160" y="276" text-anchor="middle" font-size="11.5" fill="#1b2422">END</text>
  <text x="239" y="264" text-anchor="middle" class="lb">waits for user</text>

  <text x="200" y="326" text-anchor="middle" class="lb">pause</text>
  <text x="560" y="326" text-anchor="middle" class="lb">urgent</text>
  <text x="388" y="354" class="lb">complete or sent early</text>

  <rect x="48" y="364" width="184" height="56" rx="8" class="box"/>
  <text x="140" y="388" text-anchor="middle" class="nm">pause_session</text>
  <text x="140" y="404" text-anchor="middle" class="bd">status: interrupted</text>
  <rect x="288" y="364" width="184" height="56" rx="8" class="box"/>
  <text x="380" y="388" text-anchor="middle" class="nm">generate_summary</text>
  <text x="380" y="404" text-anchor="middle" class="bd">LLM text + rule-built data</text>
  <rect x="536" y="364" width="184" height="56" rx="8" class="box"/>
  <text x="628" y="388" text-anchor="middle" class="nm">escalation_summary</text>
  <text x="628" y="404" text-anchor="middle" class="bd">fixed crisis resources</text>

  <rect x="110" y="462" width="60" height="28" rx="14" class="pill"/>
  <text x="140" y="480" text-anchor="middle" font-size="11.5" fill="#1b2422">END</text>
  <text x="256" y="450" text-anchor="end" class="lb">failed first check:</text>
  <text x="256" y="464" text-anchor="end" class="lb">regenerate once</text>

  <rect x="288" y="468" width="184" height="56" rx="8" class="box"/>
  <text x="380" y="492" text-anchor="middle" class="nm">reflect_summary</text>
  <text x="380" y="508" text-anchor="middle" class="bd">rules + LLM reviewer</text>
  <text x="484" y="488" class="lb">passed, or 2nd check done</text>

  <rect x="536" y="572" width="184" height="56" rx="8" class="acc"/>
  <text x="628" y="596" text-anchor="middle" class="nm">clinician_review_gate</text>
  <text x="628" y="612" text-anchor="middle" class="bd">interrupt() for clinician</text>
  <rect x="350" y="586" width="60" height="28" rx="14" class="pill"/>
  <text x="380" y="604" text-anchor="middle" font-size="11.5" fill="#1b2422">END</text>
  <text x="473" y="592" text-anchor="middle" class="lb">decision recorded</text>
</svg>
